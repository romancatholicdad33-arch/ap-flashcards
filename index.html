<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-color: #1f2937;
      --text-muted: #9ca3af;
      --primary: #2563eb;
      --danger: #ef4444;
      --warning: #f97316;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 12px;
      touch-action: manipulation;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px 12px 4px;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .btn-toggle {
      background: #e5e7eb;
      border: none;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #4b5563;
      cursor: pointer;
    }

    .container {
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Setup Screen */
    .card-panel {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background-color: #fff;
      font-size: 0.95rem;
      color: var(--text-color);
      outline: none;
    }

    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Flashcard View */
    .progress-text {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .card-scene {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
      margin-bottom: 16px;
      position: relative;
    }

    .flashcard {
      width: 100%;
      min-height: 420px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 3px solid transparent;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      cursor: pointer;
      user-select: none;
      will-change: transform;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    /* Swipe Highlight Classes */
    .flashcard.swipe-left {
      border-color: var(--danger) !important;
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.4) !important;
    }

    .flashcard.swipe-down {
      border-color: var(--warning) !important;
      box-shadow: 0 0 18px rgba(249, 115, 22, 0.4) !important;
    }

    .flashcard.swipe-right {
      border-color: var(--success) !important;
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.4) !important;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px 10px;
    }

    .card-text {
      font-size: 1.1rem;
      line-height: 1.5;
      font-weight: 500;
      color: #111827;
    }

    .card-img {
      max-width: 100%;
      max-height: 180px;
      object-fit: contain;
      margin-bottom: 12px;
      border-radius: 6px;
    }

    .card-footer-hint {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-rate {
      border: none;
      padding: 12px 4px;
      border-radius: 8px;
      color: white;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .btn-again { background-color: var(--danger); }
    .btn-hard { background-color: var(--warning); }
    .btn-easy { background-color: var(--success); }

    .btn-subtle {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
      width: 100%;
      padding: 8px;
      cursor: pointer;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1>A&P Flashcards</h1>
    <button class="btn-toggle" id="landscape-btn" onclick="toggleLandscape()">Landscape: Off</button>
  </header>

  <div class="container">
    
    <!-- Setup View -->
    <div id="setup-view" class="card-panel">
      <div class="form-group">
        <label>Session Mode</label>
        <select id="mode-select">
          <option value="Combined">Combined (New + Due)</option>
          <option value="New">New Cards Only</option>
          <option value="Due">Due Reviews Only</option>
        </select>
      </div>

      <div class="form-group">
        <label>Subject Filter</label>
        <select id="subject-select">
          <option value="All">Loading subjects...</option>
        </select>
      </div>

      <div class="form-group">
        <label>Card Limit</label>
        <select id="limit-select">
          <option value="10">10 Cards</option>
          <option value="20">20 Cards</option>
          <option value="50">50 Cards</option>
          <option value="0">All Available Cards</option>
        </select>
      </div>

      <button class="btn-primary" id="start-btn" onclick="startSession()">Start Studying</button>
    </div>

    <!-- Study View -->
    <div id="study-view" class="hidden">
      <div class="progress-text" id="progress-text">Card 1 of 10</div>
      
      <div class="card-scene">
        <div class="flashcard" id="flashcard">
          <div class="card-header">
            <span id="card-subject">SUBJECT</span>
            <span id="card-id">#000</span>
          </div>
          
          <div class="card-body">
            <img id="card-image" class="card-img hidden" src="" alt="Visual Aid">
            <div class="card-text" id="card-content">Question loading...</div>
          </div>

          <div class="card-footer-hint" id="card-hint">Tap to Flip</div>
        </div>
      </div>

      <div class="controls">
        <button class="btn-rate btn-again" onclick="rateCard('again')">Again (Left)</button>
        <button class="btn-rate btn-hard" onclick="rateCard('hard')">Hard (Down)</button>
        <button class="btn-rate btn-easy" onclick="rateCard('easy')">Easy (Right)</button>
      </div>

      <button class="btn-subtle" onclick="endSession()">End Session Early</button>
    </div>

    <!-- Summary View -->
    <div id="summary-view" class="card-panel hidden">
      <h2 style="text-align: center; margin-bottom: 16px;">Session Complete!</h2>
      <p id="summary-stats" style="text-align: center; margin-bottom: 24px; color: #4b5563; line-height: 1.6;"></p>
      <button class="btn-primary" onclick="resetToSetup()">Study Again</button>
    </div>

  </div>

  <script>
    var currentCards = [];
    var currentIndex = 0;
    var isFlipped = false;
    var stats = { again: 0, hard: 0, easy: 0 };
    var isLandscapeMode = false;

    // Swipe tracking variables
    var startX = 0;
    var startY = 0;
    var currentX = 0;
    var currentY = 0;
    var isDragging = false;
    var hasSwiped = false;

    window.addEventListener('DOMContentLoaded', function() {
      // Dynamically load unique subjects on page launch
      google.script.run
        .withSuccessHandler(function(subjects) {
          var select = document.getElementById('subject-select');
          select.innerHTML = '<option value="All">All Subjects</option>';
          subjects.forEach(function(subj) {
            var opt = document.createElement('option');
            opt.value = subj;
            opt.innerText = subj;
            select.appendChild(opt);
          });
        })
        .withFailureHandler(function() {
          document.getElementById('subject-select').innerHTML = '<option value="All">All Subjects</option>';
        })
        .getUniqueSubjects();

      initSwipeGestures();
    });

    function toggleLandscape() {
      isLandscapeMode = !isLandscapeMode;
      document.getElementById('landscape-btn').innerText = isLandscapeMode ? "Landscape: On" : "Landscape: Off";
      if (isLandscapeMode) {
        document.body.style.transform = "rotate(90deg)";
        document.body.style.transformOrigin = "bottom left";
        document.body.style.width = "100vh";
        document.body.style.height = "100vw";
      } else {
        document.body.style.transform = "none";
        document.body.style.width = "auto";
        document.body.style.height = "auto";
      }
    }

    function startSession() {
      var mode = document.getElementById('mode-select').value;
      var subject = document.getElementById('subject-select').value;
      var limit = parseInt(document.getElementById('limit-select').value);

      document.getElementById('start-btn').innerText = "Loading Deck...";

      google.script.run
        .withSuccessHandler(function(cards) {
          document.getElementById('start-btn').innerText = "Start Studying";
          if (!cards || cards.length === 0) {
            alert("No cards found for the selected criteria!");
            return;
          }
          currentCards = cards;
          currentIndex = 0;
          stats = { again: 0, hard: 0, easy: 0 };
          
          document.getElementById('setup-view').classList.add('hidden');
          document.getElementById('study-view').classList.remove('hidden');
          renderCard();
        })
        .getFlashcards(mode, subject, limit);
    }

    function renderCard() {
      if (currentIndex >= currentCards.length) {
        showSummary();
        return;
      }

      var card = currentCards[currentIndex];
      isFlipped = false;

      resetCardPosition();

      document.getElementById('progress-text').innerText = "Card " + (currentIndex + 1) + " of " + currentCards.length;
      document.getElementById('card-subject').innerText = card.subject;
      document.getElementById('card-id').innerText = "#" + card.id;
      document.getElementById('card-content').innerText = card.q;
      document.getElementById('card-hint').innerText = "Tap to Flip";

      var imgElem = document.getElementById('card-image');
      if (card.image && card.image.trim() !== '') {
        imgElem.src = card.image;
        imgElem.classList.remove('hidden');
      } else {
        imgElem.classList.add('hidden');
      }
    }

    function flipCard() {
      if (hasSwiped) return; // Prevent flip if action was a swipe

      var card = currentCards[currentIndex];
      isFlipped = !isFlipped;

      if (isFlipped) {
        document.getElementById('card-content').innerText = card.a;
        document.getElementById('card-hint').innerText = "Tap to See Question";
      } else {
        document.getElementById('card-content').innerText = card.q;
        document.getElementById('card-hint').innerText = "Tap to Flip";
      }
    }

    function rateCard(rating) {
      if (currentIndex >= currentCards.length) return;

      var card = currentCards[currentIndex];
      var interval = card.interval;
      var ease = card.ease;
      
      var newInterval = 0;
      var newEase = ease;
      var today = new Date();

      if (rating === 'again') {
        stats.again++;
        newInterval = 0;
        newEase = Math.max(1.3, ease - 0.2);
      } else if (rating === 'hard') {
        stats.hard++;
        newInterval = 2; // Hard set to 2-day delay
      } else if (rating === 'easy') {
        stats.easy++;
        newInterval = interval === 0 ? 5 : Math.round(interval * ease);
        newEase = ease + 0.15;
      }

      var dueDateObj = new Date(today.setDate(today.getDate() + newInterval));
      var dueDateStr = (dueDateObj.getMonth() + 1) + "/" + dueDateObj.getDate() + "/" + dueDateObj.getFullYear();

      google.script.run.updateCardProgress(card.id, newInterval, Number(newEase.toFixed(2)), dueDateStr);

      currentIndex++;
      renderCard();
    }

    /* Swipe Gesture Implementation */
    function initSwipeGestures() {
      var card = document.getElementById('flashcard');

      card.addEventListener('touchstart', function(e) {
        if (e.touches.length !== 1) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        currentX = startX;
        currentY = startY;
        isDragging = true;
        hasSwiped = false;
        card.style.transition = 'none';
      }, { passive: true });

      card.addEventListener('touchmove', function(e) {
        if (!isDragging) return;
        currentX = e.touches[0].clientX;
        currentY = e.touches[0].clientY;

        var deltaX = currentX - startX;
        var deltaY = currentY - startY;

        if (Math.abs(deltaX) > 10 || Math.abs(deltaY) > 10) {
          hasSwiped = true;
        }

        var rotate = deltaX * 0.05;
        card.style.transform = "translate(" + deltaX + "px, " + deltaY + "px) rotate(" + rotate + "deg)";

        var threshold = 40;
        card.classList.remove('swipe-left', 'swipe-right', 'swipe-down');

        if (Math.abs(deltaX) > Math.abs(deltaY)) {
          if (deltaX < -threshold) {
            card.classList.add('swipe-left');
          } else if (deltaX > threshold) {
            card.classList.add('swipe-right');
          }
        } else {
          if (deltaY > threshold) {
            card.classList.add('swipe-down');
          }
        }
      }, { passive: true });

      card.addEventListener('touchend', function(e) {
        if (!isDragging) return;
        isDragging = false;

        var deltaX = currentX - startX;
        var deltaY = currentY - startY;
        var swipeThreshold = 80;

        card.style.transition = 'transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease';

        if (hasSwiped) {
          if (Math.abs(deltaX) > Math.abs(deltaY)) {
            if (deltaX < -swipeThreshold) {
              rateCard('again');
              return;
            } else if (deltaX > swipeThreshold) {
              rateCard('easy');
              return;
            }
          } else {
            if (deltaY > swipeThreshold) {
              rateCard('hard');
              return;
            }
          }
        } else {
          flipCard(); // Pure tap
        }

        resetCardPosition();
      });

      card.addEventListener('click', function(e) {
        if (!hasSwiped) {
          flipCard();
        }
      });
    }

    function resetCardPosition() {
      var card = document.getElementById('flashcard');
      card.style.transition = 'transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease';
      card.style.transform = 'none';
      card.classList.remove('swipe-left', 'swipe-right', 'swipe-down');
      startX = 0;
      startY = 0;
      currentX = 0;
      currentY = 0;
      isDragging = false;
      hasSwiped = false;
    }

    function endSession() {
      showSummary();
    }

    function showSummary() {
      document.getElementById('study-view').classList.add('hidden');
      document.getElementById('summary-view').classList.remove('hidden');

      var total = stats.again + stats.hard + stats.easy;
      document.getElementById('summary-stats').innerHTML = 
        "Reviewed <b>" + total + "</b> card(s)<br><br>" +
        "Again: " + stats.again + "<br>" +
        "Hard: " + stats.hard + "<br>" +
        "Easy: " + stats.easy;
    }

    function resetToSetup() {
      document.getElementById('summary-view').classList.add('hidden');
      document.getElementById('setup-view').classList.remove('hidden');
    }
  </script>
</body>
</html>
