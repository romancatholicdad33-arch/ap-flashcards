<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>A&P Flashcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="header-top">
                <h1 id="subject-title">A&P Study</h1>
                <button id="add-card-btn" onclick="openModal()">+ Add Card</button>
            </div>
            
            <!-- Study Options Controls -->
            <div class="filter-controls">
                <button class="filter-btn" onclick="openFilterModal()">⚙️ Study Options</button>
                <p id="progress">Card 0 of 0</p>
            </div>
        </header>

        <main class="card-container">
            <div id="card" class="card">
                <div class="card-face front">
                    <div class="stamp stamp-left">NEEDS PRACTICE</div>
                    <div class="stamp stamp-right">MASTERED</div>
                    <p class="tag">QUESTION (Tap to Flip)</p>
                    <p id="question-text"></p>
                    <img id="card-image" class="card-img" style="display:none;" />
                </div>
                <div class="card-face back">
                    <div class="stamp stamp-left">NEEDS PRACTICE</div>
                    <div class="stamp stamp-right">MASTERED</div>
                    <p class="tag">ANSWER</p>
                    <p id="answer-text"></p>
                </div>
            </div>
        </main>

        <div id="toast">Card Accepted!</div>

        <footer class="controls">
            <div id="bucket-left" class="bucket bucket-left">❌ Need Practice</div>
            <div id="bucket-right" class="bucket bucket-right">✅ Mastered</div>
        </footer>
    </div>

    <!-- Modal for Study Options (Subject & Count Filter) -->
    <div id="filter-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h2>Session Setup</h2>
            <label class="modal-label">Select Subjects:</label>
            <div id="subject-checkboxes" class="checkbox-group"></div>

            <label class="modal-label">Session Limit (Cards):</label>
            <select id="card-limit-select">
                <option value="all">All Available Cards</option>
                <option value="5">5 Cards (Quick Session)</option>
                <option value="10">10 Cards</option>
                <option value="20">20 Cards</option>
            </select>

            <div class="modal-actions">
                <button onclick="applyFilters()" class="btn btn-right">Start Session</button>
                <button onclick="closeFilterModal()" class="btn btn-left">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Modal for Adding Cards -->
    <div id="card-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h2>Add New Flashcard</h2>
            <input type="text" id="new-subject" placeholder="Subject (e.g. Welding)" />
            <textarea id="new-q" placeholder="Question"></textarea>
            <textarea id="new-a" placeholder="Answer"></textarea>
            <input type="text" id="new-img" placeholder="Image URL (Optional)" />
            <div class="modal-actions">
                <button onclick="saveNewCard()" class="btn btn-right">Save</button>
                <button onclick="closeModal()" class="btn btn-left">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
