<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A&P Flashcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Controls -->
    <header>
        <h1>A&P Study</h1>
        <div class="header-buttons">
            <button type="button" onclick="openFilterModal()">Options</button>
            <button type="button" onclick="openModal()">+ Add</button>
        </div>
    </header>

    <!-- Session Progress -->
    <div id="progress-bar">
        <span id="subject-title">Loading...</span> | <span id="progress">Card 0 of 0</span>
    </div>

    <!-- Interactive Card Scene Container -->
    <div class="scene">
        <div id="card">
            <!-- Front Face -->
            <div class="card-face card-front">
                <div class="card-subject" id="subject-title-front">Question</div>
                <img id="card-image" src="" alt="Flashcard Diagram" style="display: none;">
                <div class="card-text" id="question-text">Loading flashcards...</div>
            </div>
            <!-- Back Face -->
            <div class="card-face card-back">
                <div class="card-subject">Answer</div>
                <div class="card-text" id="answer-text">Flip to reveal</div>
            </div>
        </div>
    </div>

    <!-- Swipe Bucket Indicators -->
    <div class="buckets">
        <div id="bucket-left" class="bucket">❌ Practice</div>
        <div id="bucket-right" class="bucket">✅ Mastered</div>
    </div>

    <!-- Toast Notification -->
    <div id="toast"></div>

    <!-- Study Options & Subject Filter Modal -->
    <div id="filter-modal" class="modal">
        <div class="modal-content">
            <h2>Study Options</h2>
            <label><strong>Select Subjects:</strong></label>
            <div id="subject-checkboxes" class="checkbox-group"></div>
            
            <label for="card-limit-select"><strong>Card Limit:</strong></label>
            <select id="card-limit-select">
                <option value="all">All Available</option>
                <option value="10">10 Cards</option>
                <option value="25">25 Cards</option>
                <option value="50">50 Cards</option>
            </select>

            <button type="button" onclick="applyFilters()">Apply & Restart</button>
            <button type="button" onclick="closeFilterModal()" style="background:#8e8e93;">Close</button>
        </div>
    </div>

    <!-- Add Custom Card Modal -->
    <div id="card-modal" class="modal">
        <div class="modal-content">
            <h2>Add Custom Card</h2>
            <input type="text" id="new-subject" placeholder="Subject (e.g., General, Airframe)">
            <input type="text" id="new-q" placeholder="Question">
            <input type="text" id="new-a" placeholder="Answer">
            <input type="text" id="new-img" placeholder="Image Path/URL (Optional)">
            <button type="button" onclick="saveNewCard()">Save Card</button>
            <button type="button" onclick="closeModal()" style="background:#8e8e93;">Cancel</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
