<style>
  /* Card Container & Flip Styles */
  .card-container {
    perspective: 1000px;
    width: 100%;
    min-height: 250px;
    cursor: pointer;
    margin-bottom: 20px;
  }
  
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.6s;
    transform-style: preserve-3d;
    border: 1px solid #e1e4e8;
    border-radius: 8px;
    background: #fafbfc;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  
  .card-container.flipped .card-inner {
    transform: rotateY(180deg);
  }
  
  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    top: 0;
    left: 0;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  
  .card-back {
    transform: rotateY(180deg);
  }

  .card-image {
    max-width: 100%;
    max-height: 180px;
    object-fit: contain;
    margin-top: 10px;
    border-radius: 4px;
  }
</style>

<script>
  // Function to render a card safely without ghost images and with proper tap-to-flip
  function renderCard(cardData) {
    const container = document.getElementById('card-container');
    
    // Conditionally render the image only if it exists and isn't empty
    let frontImageHtml = '';
    if (cardData.frontImage && cardData.frontImage.trim() !== '') {
      frontImageHtml = `<img src="${cardData.frontImage}" class="card-image">`;
    }

    let backImageHtml = '';
    if (cardData.backImage && cardData.backImage.trim() !== '') {
      backImageHtml = `<img src="${cardData.backImage}" class="card-image">`;
    }

    // Build the inner HTML with front and back faces
    container.innerHTML = `
      <div class="card-inner">
        <div class="card-front">
          <div class="card-text">${cardData.frontText}</div>
          ${frontImageHtml}
        </div>
        <div class="card-back">
          <div class="card-text">${cardData.backText}</div>
          ${backImageHtml}
        </div>
      </div>
    `;

    // Reset flip state for the new card
    container.classList.remove('flipped');

    // Attach the tap-to-flip listener
    container.onclick = function() {
      this.classList.toggle('flipped');
    };
  }
</script>
